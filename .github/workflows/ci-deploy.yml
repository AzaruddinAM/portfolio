name: Build, test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Angular site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: client/dist/portfolio/browser
          include-hidden-files: true # keeps .htaccess
          if-no-files-found: error

  api:
    name: .NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test api/Portfolio.sln --configuration Release
      - run: dotnet publish api/src/Portfolio.Api --configuration Release --output api-publish
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: api-publish
          if-no-files-found: error

  deploy:
    name: Deploy to Hostinger
    needs: [client, api]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://azaruddin.velouraone.in
    steps:
      - name: Check FTP secrets
        id: check
        env:
          # The FTP host is public (it's in DNS), so it is config, not a secret
          FTP_SERVER: ${{ vars.FTP_SERVER || 'ftp.velouraone.in' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # The FTP account opens at velouraone.in's web root; the subdomain lives in ./azaruddin/
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './azaruddin/' }}
        run: |
          missing=""
          for name in FTP_USERNAME FTP_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          # Never default to the FTP root: on a shared account that is the main website
          case "$FTP_SERVER_DIR" in
            ""|"."|"./"|"/"|"public_html"|"public_html/"|"./public_html/"|"/public_html/")
              echo "::warning::Repository variable FTP_SERVER_DIR must name the subdomain's own folder (e.g. ./azaruddin/). Skipping deploy so the main website is not overwritten."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          if [ -z "$missing" ]; then
            # Accept "ftp://host:21/" style values copied from hPanel: keep only the host name
            host=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#[/:].*$##')
            if ! getent hosts "$host" > /dev/null; then
              echo "::error::FTP host '$host' does not resolve. Set the repository variable FTP_SERVER to the FTP hostname from hPanel > Files > FTP Accounts."
              exit 1
            fi
            echo "Deploying via FTP host $host"
            echo "FTP_HOST=$host" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions > Repository secrets. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: site
          path: site
      - name: Upload over FTPS
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ vars.FTP_SERVER_DIR || './azaruddin/' }}
      - name: Smoke test
        if: steps.check.outputs.ready == 'true'
        run: |
          sleep 10
          curl --fail --silent --show-error --retry 5 --retry-delay 10 https://azaruddin.velouraone.in/ | grep -q "<app-root>"
          curl --fail --silent --show-error https://azaruddin.velouraone.in/data/portfolio.json | grep -q "Azaruddin"
          echo "Site is live."
